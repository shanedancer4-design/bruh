<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:'Rajdhani', sans-serif; }
        .viewport { position:relative; width:100vw; height:100vh; overflow:hidden; perspective: 1000px; }
        #bgMedia { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; }
        .page-nav { position:absolute; top:20px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:20; background:rgba(5,5,12,0.75); padding:8px 12px; border-radius:40px; border:1px solid rgba(0,229,255,0.3); }
        .page-tab { padding:8px 22px; border-radius:25px; background:rgba(15,15,25,0.8); border:1px solid rgba(255,255,255,0.1); color:#fff; font-family:'Orbitron', sans-serif; font-size:11px; font-weight:800; cursor:pointer; }
        .page-tab.active { background:linear-gradient(135deg, #00e5ff 0%, #0088ff 100%); color:#000; }
        .page-content { display:none; width:100%; height:100%; }
        .page-content.active { display:block; }
        .elem { position:absolute; z-index:10; }
        .discord-card { background:rgba(88,101,242,0.15); border:1px solid #5865F2; padding:12px 18px; border-radius:8px; display:flex; align-items:center; gap:12px; color:#fff; }
        .discord-btn { background:#5865F2; color:#fff; padding:6px 14px; border-radius:4px; text-decoration:none; font-weight:bold; font-size:12px; }
        .staff-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; width:380px; }
        .staff-card { display:flex; align-items:center; gap:10px; background:rgba(15,15,25,0.8); padding:8px; border-radius:6px; }
        .staff-avatar { width:36px; height:36px; border-radius:50%; border:2px solid #00e5ff; }
        .audio-bars { position:absolute; bottom:0; left:0; width:100%; height:40px; display:flex; align-items:flex-end; justify-content:center; gap:3px; z-index:4; }
        .bar { width:4px; background:#00e5ff; height:10%; transition:height 0.1s ease; }
        canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:2; }
    </style>
</head>
